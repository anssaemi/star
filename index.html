<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 칭찬별 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- 상단 고정 표 (현황판) -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                    ⭐ 우리반 칭찬별 현황판
                </h1>
                <span class="text-xs text-slate-400">별 5개 달성 시 선물 표시 생성! 🎁</span>
            </div>
            <!-- 아이들 전체 현황 표 -->
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-700 text-xs md:text-sm font-semibold">
                            <th class="p-2 border border-indigo-100 w-1/4">이름</th>
                            <th class="p-2 border border-indigo-100 w-2/4">별 현황</th>
                            <th class="p-2 border border-indigo-100 w-1/4">누적 선물 수</th>
                        </tr>
                    </thead>
                    <tbody id="statusTableBody" class="text-xs md:text-sm">
                        <!-- 동적 생성 -->
                    </tbody>
                </table>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 입력 및 조작 영역 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 잘했어요 칸 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100">
                <h2 class="text-emerald-600 font-bold text-lg mb-3 flex items-center gap-2">
                    🌟 잘했어요 (상점)
                </h2>
                <div class="flex gap-2">
                    <select id="goodSelect" class="flex-1 p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-400 outline-none bg-slate-50 text-sm">
                        <option value="">학생 선택</option>
                    </select>
                    <button onclick="addStar()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-sm text-sm">
                        + 별 주기
                    </button>
                </div>
            </div>

            <!-- 아쉬워요 칸 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100">
                <h2 class="text-rose-600 font-bold text-lg mb-3 flex items-center gap-2">
                    💧 아쉬워요 (벌점)
                </h2>
                <div class="flex gap-2">
                    <select id="badSelect" class="flex-1 p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-400 outline-none bg-slate-50 text-sm">
                        <option value="">학생 선택</option>
                    </select>
                    <button onclick="subStar()" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-sm text-sm">
                        - 별 차감
                    </button>
                </div>
            </div>
        </div>

        <!-- 학생별 개별 카드 그리드 -->
        <div>
            <h2 class="font-bold text-slate-700 text-base mb-3">👤 학생별 빠른 관리</h2>
            <div id="studentCardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <!-- 동적 생성 -->
            </div>
        </div>
    </main>

    <!-- 선물 당첨 팝업 모달 -->
    <div id="giftModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="text-6xl mb-4 animate-bounce">🎁</div>
            <h3 class="text-2xl font-extrabold text-indigo-600 mb-2">선물 수령 완료!</h3>
            <p id="giftModalText" class="text-slate-600 text-base mb-6 font-medium">선물을 받고 별이 초기화되었습니다!</p>
            <button onclick="closeGiftModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                확인
            </button>
        </div>
    </div>

    <script>
        const students = ['강은빈', '이정원', '김세희', '신안준', '신지온', '홍민서', '배은솔', '배이솔', '구도영', '박미랑', '유사랑'];
        
        // 데이터 불러오기 또는 초기화
        let data = JSON.parse(localStorage.getItem('classroom_reward_data')) || {};
        students.forEach(name => {
            if (!data[name]) {
                data[name] = { stars: 0, gifts: 0 };
            }
        });

        function saveData() {
            localStorage.setItem('classroom_reward_data', JSON.stringify(data));
            render();
        }

        function render() {
            const statusTableBody = document.getElementById('statusTableBody');
            const goodSelect = document.getElementById('goodSelect');
            const badSelect = document.getElementById('badSelect');
            const studentCardsGrid = document.getElementById('studentCardsGrid');

            statusTableBody.innerHTML = '';
            goodSelect.innerHTML = '<option value="">학생 선택</option>';
            badSelect.innerHTML = '<option value="">학생 선택</option>';
            studentCardsGrid.innerHTML = '';

            students.forEach(name => {
                const info = data[name];

                // 별 5개 모였는지 체크
                const isGiftReady = info.stars >= 5;

                // 상단 표 별 영역 표시 방식 (별 5개이면 선물 버튼으로 표시)
                let starDisplay = '';
                if (isGiftReady) {
                    starDisplay = `<button onclick="claimGift('${name}')" class="bg-amber-400 hover:bg-amber-500 text-white font-bold px-3 py-1 rounded-full text-xs animate-bounce shadow-md">🎁 선물 받기 (클릭 시 초기화)</button>`;
                } else {
                    const starsStr = '⭐'.repeat(info.stars);
                    starDisplay = `${starsStr} <span class="text-xs text-slate-500 font-bold">(${info.stars})</span>`;
                    if (info.stars === 0) starDisplay = '<span class="text-slate-300 text-xs">없음 (0)</span>';
                }

                const giftIcons = info.gifts > 0 ? `🎁 ${info.gifts}개` : '-';

                // 상단 표 렌더링
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-2 border border-slate-100 font-semibold text-slate-700">${name}</td>
                    <td class="p-2 border border-slate-100 text-center">${starDisplay}</td>
                    <td class="p-2 border border-slate-100 font-bold text-indigo-600">${giftIcons}</td>
                `;
                statusTableBody.appendChild(tr);

                // 셀렉트박스 옵션 추가
                goodSelect.innerHTML += `<option value="${name}">${name}</option>`;
                badSelect.innerHTML += `<option value="${name}">${name}</option>`;

                // 학생별 카드 렌더링
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition";
                
                let cardStarContent = '';
                if (isGiftReady) {
                    cardStarContent = `<button onclick="claimGift('${name}')" class="w-full bg-amber-400 hover:bg-amber-500 text-white font-bold py-1.5 rounded-xl text-xs animate-pulse shadow-sm mb-2">🎁 선물 받기!</button>`;
                } else {
                    cardStarContent = `<div class="text-sm mb-2 min-h-[24px] truncate">${'⭐'.repeat(info.stars)}</div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-slate-800 text-sm">${name}</span>
                            <span class="text-xs ${isGiftReady ? 'bg-amber-100 text-amber-700 font-bold' : 'bg-indigo-50 text-indigo-600 font-bold'} px-2 py-0.5 rounded-full">
                                ${isGiftReady ? '🎁 달성!' : '별 ' + info.stars + '개'}
                            </span>
                        </div>
                        ${cardStarContent}
                    </div>
                    <div class="space-y-1.5">
                        <!-- 별 조작 버튼 -->
                        <div class="flex gap-1.5">
                            <button onclick="modifyStar('${name}', 1)" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-bold py-1.5 rounded-xl text-xs transition">+ 🌟</button>
                            <button onclick="modifyStar('${name}', -1)" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-1.5 rounded-xl text-xs transition">- 💧</button>
                        </div>
                        <!-- 누적 선물 수 직접 조작 버튼 -->
                        <div class="flex items-center justify-between bg-slate-50 px-2 py-1.5 rounded-xl text-xs">
                            <span class="font-semibold text-slate-600">🎁 선물 ${info.gifts}개</span>
                            <div class="flex gap-1">
                                <button onclick="modifyGift('${name}', -1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-2 py-0.5 rounded-lg transition">-</button>
                                <button onclick="modifyGift('${name}', 1)" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold px-2 py-0.5 rounded-lg transition">+</button>
                            </div>
                        </div>
                    </div>
                `;
                studentCardsGrid.appendChild(card);
            });
        }

        function modifyStar(name, amount) {
            let current = data[name].stars + amount;
            if (current < 0) current = 0;
            if (current > 5) current = 5; // 최대 5개 유지

            data[name].stars = current;
            saveData();
        }

        function modifyGift(name, amount) {
            let current = data[name].gifts + amount;
            if (current < 0) current = 0; // 선물 개수는 0개 미만으로 내려가지 않음

            data[name].gifts = current;
            saveData();
        }

        function claimGift(name) {
            // 선물 받기 버튼 누르면 획득 수 +1, 별 0개로 초기화
            data[name].gifts += 1;
            data[name].stars = 0;
            saveData();

            showGiftModal(name);
            triggerConfetti();
        }

        function addStar() {
            const name = document.getElementById('goodSelect').value;
            if (!name) {
                alert('학생을 선택해 주세요!');
                return;
            }
            modifyStar(name, 1);
            document.getElementById('goodSelect').value = '';
        }

        function subStar() {
            const name = document.getElementById('badSelect').value;
            if (!name) {
                alert('학생을 선택해 주세요!');
                return;
            }
            modifyStar(name, -1);
            document.getElementById('badSelect').value = '';
        }

        function showGiftModal(name) {
            const modal = document.getElementById('giftModal');
            const text = document.getElementById('giftModalText');
            text.innerHTML = `<strong class="text-indigo-600 text-lg">${name}</strong> 님이 별 5개를 모두 모아<br><span class="text-xl font-bold text-amber-500">🎁 선물을 받고 별이 초기화 되었습니다!</span>`;
            modal.classList.remove('hidden');
        }

        function closeGiftModal() {
            document.getElementById('giftModal').classList.add('hidden');
        }

        function triggerConfetti() {
            confetti({
                particleCount: 180,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        // 초기 렌더링
        render();
    </script>
</body>
</html>
